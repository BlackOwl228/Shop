{% extends "base.html" %}
{% block title %}Профиль{% endblock %}

{% block content %}

<div class="row">

    <!-- ЛЕВАЯ КОЛОНКА -->
    <div class="col-md-4">

        <div class="card text-center mb-4">
            <div class="card-body">

                <img
                    src="/media/avatar/{{ user.avatar }}"
                    class="rounded-circle mb-3"
                    width="120"
                    height="120"
                    style="object-fit: cover;">

                <h5 class="card-title">
                    {{ user.name if user else "Имя пользователя" }}
                </h5>

                <p class="text-muted">
                    {{ user.email if user else "email@example.com" }}
                </p>

            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h6 class="card-title">Сменить аватар</h6>

                <form action="/me/avatar" method="patch" enctype="multipart/form-data">
                    <input type="file" class="form-control mb-2" name="avatar">
                    <button class="btn btn-outline-primary w-100">
                        Загрузить
                    </button>
                </form>
            </div>
        </div>

    </div>

    <!-- ПРАВАЯ КОЛОНКА -->
    <div class="col-md-8">

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Смена имени</h5>

                <form action="/me/name" method="patch">
                    <div class="mb-3">
                        <input
                            type="text"
                            class="form-control"
                            name="name"
                            placeholder="Новое имя">
                    </div>

                    <button class="btn btn-primary">
                        Сохранить имя
                    </button>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Смена email</h5>

                <form action="/me/email" method="patch">
                    <div class="mb-3">
                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="Новый email">
                    </div>

                    <button class="btn btn-primary">
                        Сменить email
                    </button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Смена пароля</h5>

                <form action="/me/password" method="patch">
                    <div class="mb-3">
                        <input
                            type="password"
                            class="form-control"
                            name="old_password"
                            placeholder="Текущий пароль">
                    </div>

                    <div class="mb-3">
                        <input
                            type="password"
                            class="form-control"
                            name="new_password"
                            placeholder="Новый пароль">
                    </div>

                    <button class="btn btn-danger">
                        Сменить пароль
                    </button>
                </form>
            </div>
        </div>

    </div>

</div>

{% endblock %}
