{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <div class="row">
        <!-- Левая колонка: картинка -->
        <div class="col-md-5">
            <img
                src="/media/product/{{ product.image }}"
                class="img-fluid rounded border"
                alt="{{ product.name }}"
                style="object-fit: contain; max-height: 400px;"
            >
        </div>

        <!-- Правая колонка: информация -->
        <div class="col-md-7">
            <h2 class="mb-3">{{ product.name }}</h2>

            <h4 class="text-success mb-3">
                {{ product.price }} ₽
            </h4>

            {% if product.rating %}
                <p class="mb-2">
                    ⭐ {{ product.rating }} / 5
                </p>
            {% endif %}

            <p class="text-muted">
                {{ product.description }}
            </p>

            <div class="mt-4 d-flex gap-2">
                <form action="/front/cart/add/{{ product.id }}" method="post">
                    <button class="btn btn-primary">
                        В корзину
                    </button>
                </form>

                <form action="/front/favorites/add/{{ product.id }}" method="post">
                    <button class="btn btn-outline-danger">
                        ♥ В избранное
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>
{% endblock %}
