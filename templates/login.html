<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Login{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-3" style="width: 500px;">

            <div class="card-body">
                <a class="navbar-brand fw-bold" href="/front/home">Вернуться на главную</a>

                <h4 class="card-title text-center mb-4">
                    Вход
                </h4>

                <form action="/front/login" method="post">

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <button class="btn btn-primary w-100">
                        Войти
                    </button>

                </form>

                <div class="text-center mt-3">
                    <span class="text-muted">Нет аккаунта?</span>
                    <a href="/front/register">
                        Регистрация
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>


</body>
</html>
