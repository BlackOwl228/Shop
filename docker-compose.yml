version: '3.9'

services:
  web:
    build: .
    container_name: python_app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: nier_secret_password
      POSTGRES_DB: shop
      DATABASE_URL: postgresql://app_user:nier_secret_password@db:5432/shop

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: nier_secret_password
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: