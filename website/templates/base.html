<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Shop{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">

        <!-- LEFT -->
        <a class="navbar-brand fw-bold" href="/front/home">Shop</a>

        <!-- CENTER -->
        <form class="d-flex mx-auto w-50" action="/front/search" method="get">
            <input class="form-control me-2"
                type="search"
                name="q"
                placeholder="Поиск товаров">
            <button class="btn btn-outline-success">Найти</button>
        </form>

        <!-- RIGHT -->
        <div class="ms-auto">
            <ul class="navbar-nav flex-row gap-3">

                <li class="nav-item">
                    <a class="nav-link" href="/front/cart">
                        Корзина
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/front/favorites">Избранное</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/front/profile">Профиль</a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-outline-primary"
                       href="/front/login">
                        Вход
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
